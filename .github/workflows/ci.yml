name: CPU checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
      - name: Verify required test dependencies
        run: python -c "import torch, numpy, safetensors; assert not torch.cuda.is_available()"
      - name: Run synthetic data, retrieval and precision checks
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Check source syntax
        run: python -m compileall -q scripts examples
